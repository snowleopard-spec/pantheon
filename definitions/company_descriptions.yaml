  61% of it) and is managed by Vornado.

AMAT: >-
  Makes wafer-fabrication equipment for semiconductor manufacturing—materials
  engineering, process control and advanced packaging—plus services, spares and
  automation software for installed fabs worldwide.

AMBA: >-
  Develops low-power system-on-chip semiconductors and software for edge and physical
