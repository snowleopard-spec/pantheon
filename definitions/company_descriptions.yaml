ALRM: >-
  Cloud platform for connected-property services—security, video analytics, energy and
  access control—sold through service-provider partners; earns recurring SaaS and
  license fees plus hardware sales such as cameras.

ALX: >-
  REIT owning five New York City properties, including the Bloomberg-anchored 731
