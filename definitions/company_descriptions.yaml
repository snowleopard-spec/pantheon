AIV: >-
  Multifamily REIT winding down under a stockholder-approved plan of sale and
  liquidation; earns apartment rental income while it sells its U.S. communities and
  returns net proceeds to shareholders.

AKR: >-
  Equity REIT owning street and open-air retail in dense U.S. metro corridors plus an
  institutional fund platform; earns mostly tenant rents and expense recoveries, with
  fund management and incentive fees.

ALAB: >-
  Designs semiconductor connectivity products for AI and cloud data centers—PCIe/CXL
  retimers, Ethernet cable modules, CXL memory controllers and fabric switches with
