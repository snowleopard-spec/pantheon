# Two-line company descriptions, shown under price charts and in the search
# panel on the Pantheon report. Keyed by ticker; plain text values.
#
# Generated 2026-08-10 by parallel agents reading each company's 10-K Item 1
# extract (data/raw/). HAND-EDITS WELCOME — this file is the source of truth
# and nothing regenerates it wholesale. To add a company, add a line; the
# report warns at render time about index members missing an entry.

AAOI: >-
  Designs and manufactures fiber-optic networking products, from lasers to
  transceivers and turn-key equipment; revenue comes mainly from cable TV network gear
  and optical transceivers for hyperscale data centers.

AAPL: >-
  Designs and sells smartphones, personal computers, tablets, wearables and
  accessories, earning further revenue from services including the App Store,
  advertising, AppleCare, cloud, subscriptions and payments.

AAT: >-
  Vertically integrated REIT that owns and operates office, retail, multifamily and
  mixed-use properties in Southern/Northern California, Washington, Oregon, Texas and
  Hawaii; earns rent from tenants across its portfolio.

AATC: >-
  Holding company whose main subsidiary makes above-ground traffic detection products
  using video and radar for intersection and highway management; sells through
  distributors to government agencies and municipalities.

ABR: >-
  REIT and direct lender for commercial real estate, mainly multifamily; earns
  interest on bridge and mezzanine loans plus fees and servicing income from
  originating and selling agency loans through Fannie Mae, Freddie Mac and HUD.

ACIW: >-
  Develops payments orchestration software for banks, merchants and billers, covering
  card issuing/acquiring, real-time payments, fraud management and bill payment; earns
  from software licenses, SaaS and payment services.

ACMR: >-
  Makes capital equipment for semiconductor fabs — wet cleaning, plating, furnace,
  PECVD, track and advanced packaging tools; most revenue comes from single-wafer
  cleaning systems sold to chipmakers in Asia.

ACRE: >-
  Specialty finance REIT that directly originates and holds commercial real estate
  loans — senior mortgages, subordinated debt, mezzanine and preferred equity; earns
  interest income and is externally managed by an Ares Management unit.

ADAM: >-
  Internally managed mortgage REIT holding Agency RMBS, residential loans and other
  credit-sensitive housing assets; also originates business-purpose loans to
  residential real estate investors through its Constructive subsidiary.

ADC: >-
  REIT focused on retail properties net leased to national tenants, with 2,674
  properties across all 50 states; earns long-term net-lease rent, with tenants
  covering taxes, insurance and maintenance.

ADI: >-
  Designs and manufactures analog, mixed-signal and power semiconductors — data
  converters, amplifiers, RF ICs, power management and sensors — sold to OEMs across
  industrial, automotive, communications, consumer and healthcare markets.

ADNH: >-
  Develops high-temperature PEM fuel cell technology, focusing on membrane electrode
  assemblies and stacks; much of current revenue comes from joint development and
  technology assessment agreements with OEMs such as Airbus and Hyundai.

ADP: >-
  Provides HR and payroll (human capital management) software and outsourcing —
  payroll, time, benefits, talent and compliance; earns recurring fees from over 1.1
  million clients, paying 42 million workers worldwide.

ADSK: >-
  Makes 3D design and engineering software — AutoCAD, Revit, Fusion, Maya — for
  architecture/construction, manufacturing and media; earns subscription revenue sold
  through direct and indirect channels globally.

ADTN: >-
  Supplies fiber broadband access, optical transport and subscriber networking
  equipment plus SaaS and support services; revenue comes from telecom service
  providers, utilities, enterprises and government customers.

AEHR: >-
  Builds semiconductor test and burn-in systems for wafer-level, singulated die and
  packaged parts; sells FOX systems, WaferPak contactors and DiePak carriers for
  silicon carbide power devices, AI processors and photonics.

AEIS: >-
  Designs and services precision power conversion, measurement and control products;
  revenue comes from OEMs and end users in semiconductor equipment, data center
  computing, industrial/medical, and telecom and networking markets.

AEP: >-
  Public utility holding company whose subsidiaries generate, transmit and distribute
  electricity to roughly five million retail customers across eleven states; earns
  regulated retail and wholesale electricity revenues.

AES: >-
  Global energy company developing and operating power generation — majority
  renewables — sold under long-term contracts to corporate and data center customers,
  plus regulated electric utilities in Indiana and Ohio.

AETN: >-
  Operates a network of electrified truck parking spaces at travel centers, letting
  trucks and refrigerated trailers plug in instead of idling; earns energy vending
  fees and relies on government grants to fund EV charging upgrades.

AGNC: >-
  Internally managed REIT that invests in government-guaranteed Agency residential
  mortgage-backed securities on a leveraged basis; earns the spread between interest
  on its portfolio and repo borrowing and hedging costs.

AHR: >-
  Self-managed REIT that owns and operates senior housing, skilled nursing, outpatient
  medical and other healthcare properties in the US, UK and Isle of Man; earns rent
  and operating income via RIDEA structures.

AHT: >-
  REIT holding 68 upscale and upper-upscale full-service US hotels branded Hilton,
  Hyatt, Marriott and IHG; earns hotel operating revenue through third-party managers
  and is externally advised by an Ashford Inc. subsidiary.

AI: >-
  Sells enterprise AI application software — an agentic AI platform, industry-specific
  applications and generative AI tools; earns subscription revenue from businesses and
  government customers, deployed on cloud or on-premises.

AIFF: >-
  Applies AI to brain health via an FDA-cleared EEG/ERP system that captures brain
