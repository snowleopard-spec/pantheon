ALKT: >-
  Cloud-based digital banking and account-opening platform for U.S. community and
  regional banks and credit unions; earns nearly all revenue from multi-year SaaS
  subscriptions priced per registered user.

ALMU: >-
  Develops compound-semiconductor photodetectors and photonics on large-diameter
