ALGM: >-
  Designs magnetic sensor ICs and application-specific power ICs for motion sensing
  and power management in automotive and industrial systems; fabless revenue from chip
  sales to carmakers, tier-1 suppliers and industrial customers.

ALIS: >-
  Blank-check SPAC with no operating revenue, formed to complete a business
  combination with a focus on Asia; has agreed to merge with Goodvision AI, with IPO
