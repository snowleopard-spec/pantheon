[project]
name = "minidex"
version = "0.1.0"
description = "Thematic sub-index classifier for US-listed tech/AI companies"
requires-python = ">=3.12"
dependencies = [
    "edgartools>=4.0",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "typer>=0.12",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "yfinance>=0.2",
]

[project.scripts]
minidex = "minidex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minidex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
