[project]
name = "minidex"
version = "0.1.0"
description = "Thematic sub-index classifier for US-listed tech/AI companies"
requires-python = ">=3.12"
# Lean base: everything needed by scripts/pull_prices.py, scripts/bucket_returns.py,
# and the always-imported minidex modules (cli, config, db, models, qc, indices).
# The droplet installs only this profile via plain `uv sync`.
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

# Heavy pipeline stages (EDGAR fetch, embedding shortlist, LLM scoring) — Mac only.
# Install with `uv sync --extra scoring`. Must never be installed on the droplet (spec D4).
[project.optional-dependencies]
scoring = [
    "edgartools>=4.0",
    "sentence-transformers>=3.0",
    "anthropic>=0.40",
    "yfinance>=0.2",
    "pyarrow>=15.0",
]

[project.scripts]
minidex = "minidex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minidex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
